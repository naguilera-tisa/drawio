services:
  app:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    environment:
      DATABASE_URL: postgres://drawio:${POSTGRES_PASSWORD:-drawio}@db:5432/drawio
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drawio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawio}
      POSTGRES_DB: drawio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawio -d drawio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
